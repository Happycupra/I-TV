name: Android TV modernization

on:
  push:
    branches:
      - refactor/android-tv-modernization
      - feature/touch-refresh-maintenance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modernize-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Android TV modernization
        run: python3 scripts/modernize_android_tv.py

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and release build
        run: ./gradlew test assembleRelease --stacktrace

      - name: Copy release APK into repository output folder
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/I-TV-release.apk
          (cd release-apk && sha256sum I-TV-release.apk > SHA256SUMS.txt)

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: I-TV-release-apk
          path: |
            release-apk/I-TV-release.apk
            release-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit modernization and APK back to branch
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle.kts gradle scripts release-apk
          git commit -m "Modernize Android TV stack and refresh release APK"
          git push origin HEAD:${GITHUB_REF_NAME}
